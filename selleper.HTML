<!DOCTYPE html>
<html>

<head>
    <title>Mind Care Sleep Tracker</title>

    <style>

        body{
            background:#dff6ff;
            text-align:center;
            font-family:Arial;
            margin-top:70px;
        }

        h1{
            color:#333;
        }

        input{

            width:200px;
            padding:12px;
            font-size:20px;
            border-radius:10px;
            border:1px solid gray;
        }

        button{

            margin-top:20px;
            padding:15px 30px;
            font-size:20px;
            border:none;
            border-radius:15px;
            background:#673ab7;
            color:white;
            cursor:pointer;
        }

        #result{

            margin-top:30px;
            font-size:24px;
            color:#444;
        }

    </style>
</head>

<body>

    <h1>Mind Care Sleep Tracker 😴</h1>

    <input type="number"
    id="sleep"
    placeholder="Hours slept">

    <br>

    <button onclick="checkSleep()">

        Check Sleep

    </button>

    <div id="result"></div>

    <script>

        function checkSleep(){

            let hours =
            document.getElementById("sleep").value;

            if(hours >= 8){

                document.getElementById("result").innerHTML =

                "Great sleep 🌙✨";

            }

            else if(hours >= 5){

                document.getElementById("result").innerHTML =

                "Try to sleep a bit more 🌸";

            }

            else{

                document.getElementById("result").innerHTML =

                "Lack of sleep can increase stress 😴";

            }

        }

    </script>

</body>
</html>
