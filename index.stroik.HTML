<!DOCTYPE html>
<html>

<head>
    <title>Mind Care Daily Streak</title>

    <style>

        body{
            background:#dff6ff;
            text-align:center;
            font-family:Arial;
            margin-top:80px;
        }

        h1{
            color:#333;
        }

        #streak{

            font-size:60px;
            margin-top:40px;
            color:#ff5722;
        }

        button{

            margin-top:30px;
            padding:15px 30px;
            font-size:20px;
            border:none;
            border-radius:15px;
            background:#4caf50;
            color:white;
            cursor:pointer;
        }

        #message{

            margin-top:30px;
            font-size:24px;
            color:#444;
        }

    </style>
</head>

<body>

    <h1>Mind Care Daily Streak 🔥</h1>

    <div id="streak">

        0

    </div>

    <button onclick="increaseStreak()">

        Complete Today's Check-In

    </button>

    <div id="message"></div>

    <script>

        let streak =
        localStorage.getItem("streak");

        if(streak == null){

            streak = 0;
        }

        document.getElementById("streak").innerHTML =
        streak;

        function increaseStreak(){

            streak++;

            localStorage.setItem("streak", streak);

            document.getElementById("streak").innerHTML =
            streak;

            document.getElementById("message").innerHTML =

            "Amazing! Keep going 🌸";

        }

    </script>

</body>
</html>
