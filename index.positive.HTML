<!DOCTYPE html>
<html>

<head>
    <title>Mind Care Breathing Exercise</title>

    <style>

        body{
            background:#dff6ff;
            text-align:center;
            font-family:Arial;
            margin-top:70px;
        }

        h1{
            color:#333;
        }

        #circle{

            width:200px;
            height:200px;
            background:#4caf50;
            border-radius:50%;
            margin:auto;
            margin-top:40px;

            animation:breathe 4s infinite;
        }

        @keyframes breathe{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.3);
            }

            100%{
                transform:scale(1);
            }
        }

        #count{

            font-size:50px;
            margin-top:30px;
            color:#444;
        }

        button{

            margin-top:30px;
            padding:15px 30px;
            font-size:20px;
            border:none;
            border-radius:15px;
            background:#4caf50;
            color:white;
            cursor:pointer;
        }

    </style>
</head>

<body>

    <h1>Mind Care Breathing 🌸</h1>

    <div id="circle"></div>

    <div id="count">

        0

    </div>

    <button onclick="addBreath()">

        Complete Breath

    </button>

    <script>

        let breaths = 0;

        function addBreath(){

            breaths++;

            document.getElementById("count").innerHTML =
            breaths;

        }

    </script>

</body>
</html>
