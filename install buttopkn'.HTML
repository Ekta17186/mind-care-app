<!DOCTYPE html>
<html>

<head>
    <title>Mind Care Install App</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <style>

        body{
            background:#dff6ff;
            text-align:center;
            font-family:Arial;
            margin-top:100px;
        }

        h1{
            color:#333;
        }

        button{

            padding:15px 30px;
            font-size:20px;
            border:none;
            border-radius:15px;
            background:#4caf50;
            color:white;
            cursor:pointer;
        }

        #message{

            margin-top:30px;
            font-size:24px;
            color:#444;
        }

    </style>
</head>

<body>

    <h1>Mind Care 🌸</h1>

    <button onclick="installApp()">

        Install App 📲

    </button>

    <div id="message"></div>

    <script>

        function installApp(){

            document.getElementById("message").innerHTML =

            "To install:<br><br>" +

            "Browser Menu ⋮ → Add to Home Screen 📲";

        }

    </script>

</body>
</html>
