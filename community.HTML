<!DOCTYPE html>
<html>

<head>
    <title>Mind Care Community</title>

    <style>

        body{
            background:#dff6ff;
            text-align:center;
            font-family:Arial;
            margin-top:50px;
        }

        h1{
            color:#333;
        }

        textarea{

            width:300px;
            height:100px;
            padding:10px;
            border-radius:10px;
            border:1px solid gray;
            font-size:16px;
        }

        button{

            margin-top:20px;
            padding:12px 25px;
            font-size:18px;
            border:none;
            border-radius:10px;
            background:#4caf50;
            color:white;
            cursor:pointer;
        }

        #posts{

            width:320px;
            margin:auto;
            margin-top:30px;
        }

        .post{

            background:white;
            padding:15px;
            margin-top:15px;
            border-radius:10px;
            box-shadow:0 0 5px gray;
            color:#444;
        }

    </style>
</head>

<body>

    <h1>Mind Care Community 🌍</h1>

    <textarea id="message"
    placeholder="Write something positive...">
    </textarea>

    <br>

    <button onclick="addPost()">

        Post Message

    </button>

    <div id="posts"></div>

    <script>

        function addPost(){

            let text =
            document.getElementById("message").value;

            let newPost =
            document.createElement("div");

            newPost.className = "post";

            newPost.innerHTML = text;

            document.getElementById("posts")
            .appendChild(newPost);

            document.getElementById("message").value = "";

        }

    </script>

</body>
</html>
