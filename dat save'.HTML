<!DOCTYPE html>
<html>

<head>
    <title>Mind Care Profile</title>

    <style>

        body{
            background:#dff6ff;
            text-align:center;
            font-family:Arial;
            margin-top:80px;
        }

        h1{
            color:#333;
        }

        input{

            width:250px;
            padding:12px;
            font-size:18px;
            border-radius:10px;
            border:1px solid gray;
        }

        button{

            margin-top:20px;
            padding:15px 30px;
            font-size:18px;
            border:none;
            border-radius:15px;
            background:#4caf50;
            color:white;
            cursor:pointer;
        }

        #profile{

            width:300px;
            margin:auto;
            margin-top:40px;
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 10px gray;
            font-size:24px;
            color:#444;
        }

    </style>
</head>

<body>

    <h1>Mind Care User Profile 🌸</h1>

    <input type="text"
    id="name"
    placeholder="Enter your name">

    <br>

    <button onclick="saveName()">

        Save Profile

    </button>

    <div id="profile">

        No Profile Saved

    </div>

    <script>

        function saveName(){

            let name =
            document.getElementById("name").value;

            localStorage.setItem("mindcareUser", name);

            document.getElementById("profile").innerHTML =

            "Welcome " + name + " 😊";

        }

        let savedName =
        localStorage.getItem("mindcareUser");

        if(savedName){

            document.getElementById("profile").innerHTML =

            "Welcome Back " + savedName + " 🌸";

        }

    </script>

</body>
</html>
