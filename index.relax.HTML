<!DOCTYPE html>
<html>

<head>
    <title>Mind Care</title>

    <style>

        body{
            background:#dff6ff;
            text-align:center;
            font-family:Arial;
            margin-top:50px;
        }

        h1{
            color:#333;
        }

        #circle{

            width:200px;
            height:200px;
            background:#4caf50;
            border-radius:50%;
            margin:auto;
            margin-top:50px;

            animation: breathe 4s infinite;
        }

        @keyframes breathe{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.3);
            }

            100%{
                transform:scale(1);
            }
        }

        #text{
            font-size:30px;
            margin-top:30px;
            color:#444;
        }

    </style>
</head>

<body>

    <h1>Mind Care Relaxation 🌸</h1>

    <div id="circle"></div>

    <div id="text">
        Breathe In... Breathe Out...
    </div>

</body>
</html>
