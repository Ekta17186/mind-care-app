<!DOCTYPE html>
<html>

<head>
    <title>Mind Care</title>

    <style>

        body{
            background:#dff6ff;
            text-align:center;
            font-family:Arial;
            margin-top:50px;
        }

        h1{
            color:#333;
        }

        button{
            padding:10px 20px;
            margin:10px;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }

        .happy{
            background:#4caf50;
            color:white;
        }

        .sad{
            background:#2196f3;
            color:white;
        }

        .stress{
            background:#ff5722;
            color:white;
        }

        #result{
            margin-top:30px;
            font-size:25px;
            color:#444;
        }

    </style>
</head>

<body>

    <h1>Mind Care</h1>

    <h2>How are you feeling today?</h2>

    <button class="happy" onclick="happyMood()">
        Happy 😊
    </button>

    <button class="sad" onclick="sadMood()">
        Sad 😔
    </button>

    <button class="stress" onclick="stressMood()">
        Stress 😣
    </button>

    <div id="result"></div>

    <script>

        function happyMood(){
            document.getElementById("result").innerHTML =
            "Great! Keep Smiling 😊";
        }

        function sadMood(){
            document.getElementById("result").innerHTML =
            "Everything will be okay 💙";
        }

        function stressMood(){
            document.getElementById("result").innerHTML =
            "Take a deep breath 🌸";
        }

    </script>

</body>
</html>
