<!DOCTYPE html>
<html>

<head>
    <title>Mind Care AI Chat</title>

    <style>

        body{
            background:#dff6ff;
            font-family:Arial;
            text-align:center;
            padding-top:50px;
        }

        h1{
            color:#333;
        }

        #chatbox{

            width:300px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 10px gray;
        }

        input{

            width:80%;
            padding:10px;
            margin-top:10px;
        }

        button{

            padding:10px 20px;
            margin-top:10px;
            border:none;
            background:#4caf50;
            color:white;
            border-radius:10px;
        }

        #reply{

            margin-top:20px;
            font-size:20px;
            color:#444;
        }

    </style>
</head>

<body>

    <h1>Mind Care AI 🤖</h1>

    <div id="chatbox">

        <input type="text"
        id="userText"
        placeholder="Type here...">

        <br>

        <button onclick="replyBot()">
            Send
        </button>

        <div id="reply"></div>

    </div>

    <script>

        function replyBot(){

            let text =
            document.getElementById("userText").value;

            let reply = "";

            if(text.includes("sad")){

                reply =
                "I am here for you 💙";
            }

            else if(text.includes("stress")){

                reply =
                "Take a deep breath 🌸";
            }

            else if(text.includes("happy")){

                reply =
                "That is wonderful 😊";
            }

            else{

                reply =
                "Everything will be okay ✨";
            }

            document.getElementById("reply").innerHTML =
            reply;
        }

    </script>

</body>
</html>
